[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "general-payroll-tool"
version = "0.2.0b3"
description = "Offline-first configurable payroll and attendance calculation tool"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "PyYAML>=6,<7",
    "platformdirs>=4.3,<5",
    "pywebview>=5.4,<7",
]

[project.optional-dependencies]
build = ["PyInstaller>=6.10,<7"]

[project.scripts]
general-payroll-tool = "desktop:main"

[tool.setuptools.packages.find]
include = ["payroll_tool*"]

[tool.setuptools]
py-modules = ["app", "desktop"]
